name: mac-remote-build

on:
  push:
    branches: [ci-mac]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Make the build remote-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/desktop/electron-builder.yml')
          s = p.read_text()
          s = s.replace('  - from: resources/bundled-aioncore\n    to: bundled-aioncore\n', '')
          s = s.replace('  - from: resources/hub\n    to: hub\n', '')
          p.write_text(s)
          PY

      - name: Build macOS arm64
        env:
          AIONUI_SKIP_PREPARE_AIONCORE: '1'
          AIONUI_HUB_SKIP: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/build-with-builder.js arm64 --mac --arm64 --config.mac.identity=null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            out/*.zip
            out/*.dmg
          if-no-files-found: error
          retention-days: 3
