name: aionui

services:
  aionui:
    image: aionui-local:2.2.2-weixin
    build:
      context: .
      dockerfile: deploy/Dockerfile
      additional_contexts:
        aioncore: ${AIONCORE_BUILD_CONTEXT:-../AionCore-v0.2.2-weixin-file-send}
    restart: unless-stopped
    init: true
    ports:
      - "${AIONUI_BIND_IP:-0.0.0.0}:${AIONUI_PORT:-25808}:25808"
    volumes:
      - aionui_data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:25808/api/auth/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  aionui_data:
